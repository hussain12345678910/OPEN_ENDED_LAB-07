<!DOCTYPE html>
<html>
<head>
<title>Contact</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/contact.css') }}">

</head>

<body>

<nav>
  <div class="logo">Nexa<span>Studio</span></div>
  <ul class="nav-links">
    <li><a href="{{ url_for('index') }}">Home</a></li>
    <li><a href="{{ url_for('about') }}">About</a></li>
    <li><a href="{{ url_for('services') }}">Services</a></li>
    <li><a href="{{ url_for('gallery') }}">Gallery</a></li>
    <li><a href="{{ url_for('contact') }}" class="active">Contact</a></li>
  </ul>
  <a href="{{ url_for('login') }}" class="nav-cta">Sign In</a>
</nav>

<section class="section">

  <div class="contact-grid">
    <div class="contact-info">
      <h2>Let's Talk 👋</h2>
      <p>Have a project in mind or just want to say hello? Fill out the form and we’ll get back to you.</p>

      <div class="info-item">
        <span>📍</span>
        <p>Karachi, Pakistan</p>
      </div>

      <div class="info-item">
        <span>📧</span>
        <p>hello@nexastudio.com</p>
      </div>

      <div class="info-item">
        <span>📞</span>
        <p>+92 300 1234567</p>
      </div>
    </div>

    <!-- RIGHT SIDE FORM -->
    <form class="contact-form" action="{{ url_for('contact') }}" method="POST">

      <div class="row">
        <input type="text" placeholder="First Name" name="first_name" required>
        <input type="text" placeholder="Last Name" name="last_name" required>
      </div>

      <input type="email" placeholder="Email Address" name="email" required>

      <select name="service">
        <option>Select Service</option>
        <option>Web Development</option>
        <option>UI/UX Design</option>
        <option>Mobile App</option>
      </select>

      <textarea placeholder="Your Message..." name="message" required></textarea>

      <button type="submit">Send Message →</button>

    </form>

  </div>

</section>

</body>
</html>
