<!DOCTYPE html>
<html>
<head>
<title>Register</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<nav>
  <div class="logo">Nexa<span>Studio</span></div>
  <ul class="nav-links">
    <li><a href="{{ url_for('index') }}">Home</a></li>
    <li><a href="{{ url_for('about') }}">About</a></li>
    <li><a href="{{ url_for('services') }}">Services</a></li>
    <li><a href="{{ url_for('gallery') }}">Gallery</a></li>
    <li><a href="{{ url_for('contact') }}">Contact</a></li>
  </ul>
  <a href="{{ url_for('login') }}" class="nav-cta">Sign In</a>
</nav>

<div class="auth-container">
  <div class="auth-left">
    <h1>Join NexaStudio 🚀</h1>
    <p>Create your account and start building amazing digital products today.</p>
  </div>
  <div class="auth-card">

    <h2>Create Account</h2>
    <p class="sub">Fill in your details</p>

    <form action="{{ url_for('register') }}" method="POST">

      <input type="text" placeholder="Full Name" name="full_name" required>
      <input type="email" placeholder="Email Address" name="email" required>
      <input type="text" placeholder="Username" name="username" required>
      <input type="password" placeholder="Password" name="password" required>

      <div class="auth-options">
        <label><input type="checkbox"> I agree to Terms</label>
      </div>

      <button type="submit">Create Account →</button>

    </form>

    <p class="switch">
      Already have an account?
      <a href="{{ url_for('login') }}">Login</a>
    </p>

  </div>

</div>

</body>
</html>
